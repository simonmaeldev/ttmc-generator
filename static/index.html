<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTMC Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #3a7a2a;
    --bg: #f5f5f5;
    --sidebar-w: 240px;
    --radius: 8px;
    --shadow: 0 1px 4px rgba(0,0,0,.12);
  }

  body { font-family: system-ui, sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: #fff; border-right: 1px solid #e0e0e0;
    display: flex; flex-direction: column; height: 100vh;
  }
  #sidebar-header {
    padding: 16px 12px 8px;
    font-weight: 700; font-size: 15px; color: var(--accent);
    border-bottom: 1px solid #e0e0e0;
    display: flex; align-items: center; justify-content: space-between;
  }
  #sidebar-header span { font-size: 20px; }
  #btn-new {
    background: var(--accent); color: #fff; border: none;
    width: 28px; height: 28px; border-radius: 50%; font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  #carte-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .carte-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; cursor: pointer; border-radius: 6px; margin: 2px 6px;
    transition: background .15s;
  }
  .carte-item:hover { background: #f0f0f0; }
  .carte-item.active { background: #e6f2e0; color: var(--accent); font-weight: 600; }
  .carte-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .btn-delete { background: none; border: none; cursor: pointer; color: #bbb; font-size: 15px; padding: 2px 4px; }
  .btn-delete:hover { color: #e55; }

  /* Sidebar footer */
  #sidebar-footer { padding: 10px 12px; border-top: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 8px; }
  .setting-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555; }
  .setting-row label { flex: 1; }
  .setting-row input[type=color] { width: 32px; height: 24px; border: none; cursor: pointer; border-radius: 4px; }
  .setting-row input[type=password] { flex: 1; border: 1px solid #ddd; border-radius: 4px; padding: 3px 6px; font-size: 11px; }
  #btn-prompt { background: none; border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; }

  /* ── Main ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Toolbar */
  #toolbar {
    background: #fff; border-bottom: 1px solid #e0e0e0;
    padding: 10px 20px; display: flex; align-items: center; gap: 12px;
  }
  #theme-input {
    font-size: 18px; font-weight: 700; border: none; outline: none;
    flex: 1; color: #222; background: transparent;
  }
  #theme-input::placeholder { color: #bbb; }
  .btn { padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2d6220; }
  .btn-secondary { background: #eee; color: #333; }
  .btn-secondary:hover { background: #ddd; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Content */
  #content { flex: 1; display: flex; gap: 0; overflow: hidden; }

  .col { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 16px; gap: 8px; }
  .col + .col { border-left: 1px solid #e0e0e0; }
  .col-title { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }

  /* Items */
  .item-row {
    display: flex; align-items: flex-start; gap: 8px;
    background: #fff; border-radius: 6px; padding: 8px 10px;
    box-shadow: var(--shadow); position: relative;
  }
  .item-num {
    font-weight: 700; font-size: 15px; color: var(--accent);
    min-width: 20px; padding-top: 1px;
  }
  .item-text {
    flex: 1; border: none; outline: none; resize: none;
    font-size: 13px; line-height: 1.4; font-family: inherit;
    background: transparent; min-height: 36px;
  }
  .btn-ai {
    background: none; border: 1px solid #ddd; border-radius: 4px;
    padding: 2px 6px; font-size: 11px; cursor: pointer; color: #666;
    white-space: nowrap;
  }
  .btn-ai:hover { background: #f5f5f5; border-color: var(--accent); color: var(--accent); }

  /* Export */
  #export-bar {
    background: #fff; border-top: 1px solid #e0e0e0;
    padding: 10px 20px; display: flex; align-items: center; gap: 12px;
  }
  #export-status { font-size: 12px; color: #888; flex: 1; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #333; color: #fff; padding: 10px 16px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none;
    max-width: 320px;
  }
  #toast.show { opacity: 1; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: #fff; border-radius: 10px; padding: 24px; width: 560px; max-width: 95vw;
    box-shadow: 0 8px 32px rgba(0,0,0,.2);
  }
  .modal h2 { font-size: 16px; margin-bottom: 12px; }
  .modal textarea {
    width: 100%; height: 300px; border: 1px solid #ddd; border-radius: 6px;
    padding: 10px; font-size: 12px; font-family: monospace; resize: vertical;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  /* Empty state */
  #empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #bbb; font-size: 15px; flex-direction: column; gap: 12px;
  }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div id="sidebar-header">
    <span>🃏 TTMC</span>
    <button id="btn-new" title="Nouvelle carte">+</button>
  </div>
  <div id="carte-list"></div>
  <div id="sidebar-footer">
    <div class="setting-row">
      <label>Couleur du thème</label>
      <input type="color" id="color-picker" value="#3a7a2a">
    </div>
    <div class="setting-row">
      <label>Clé API Anthropic</label>
      <input type="password" id="api-key-input" placeholder="sk-ant-…">
    </div>
    <div class="setting-row" id="usage-row" style="font-size:11px;color:#888">
      Coût total IA : <span id="usage-display">$0.0000</span>
    </div>
    <button id="btn-prompt" class="btn">Configurer le prompt IA</button>
  </div>
</aside>

<!-- Main -->
<main id="main">
  <div id="toolbar">
    <input id="theme-input" placeholder="Thème de la carte…" disabled>
    <button id="btn-gen-all" class="btn btn-primary" disabled>✨ Générer tout</button>
    <button id="btn-save" class="btn btn-secondary" disabled>💾 Enregistrer</button>
  </div>

  <div id="content">
    <div id="empty-state">
      <div>Sélectionne ou crée une carte</div>
    </div>
  </div>

  <div id="export-bar">
    <span id="export-status">Aucune carte chargée.</span>
    <button id="btn-export-current" class="btn btn-secondary" disabled>Exporter cette carte</button>
    <button id="btn-export-all" class="btn btn-primary" disabled>Exporter toutes les cartes</button>
  </div>
</main>

<!-- Toast -->
<div id="toast"></div>

<!-- Modal prompt -->
<div id="modal-prompt" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>Prompt IA</h2>
    <p style="font-size:12px;color:#888;margin-bottom:8px">
      Variables disponibles : <code>{theme}</code>, <code>{questions_existantes}</code>, <code>{reponses_existantes}</code>
    </p>
    <textarea id="prompt-textarea"></textarea>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btn-prompt-cancel">Annuler</button>
      <button class="btn btn-primary" id="btn-prompt-save">Enregistrer</button>
    </div>
  </div>
</div>

<script>
// ── État ────────────────────────────────────────────────────
let currentSlug = null;
let currentCard = null;
let config = {};

// ── Utils ───────────────────────────────────────────────────
function toast(msg, duration = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  return r.json();
}

function slugify(str) {
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'carte';
}

// ── Config ──────────────────────────────────────────────────
async function loadConfig() {
  config = await api('/api/config');
  document.getElementById('color-picker').value = config.color || '#3a7a2a';
  document.getElementById('api-key-input').value = config.api_key || '';
  document.documentElement.style.setProperty('--accent', config.color || '#3a7a2a');
}

async function saveConfig() {
  config.color   = document.getElementById('color-picker').value;
  config.api_key = document.getElementById('api-key-input').value;
  await api('/api/config', 'POST', config);
  document.documentElement.style.setProperty('--accent', config.color);
}

document.getElementById('color-picker').addEventListener('change', saveConfig);
document.getElementById('api-key-input').addEventListener('change', saveConfig);

// ── Liste des cartes ────────────────────────────────────────
async function loadList() {
  const cartes = await api('/api/cartes');
  const list = document.getElementById('carte-list');
  list.innerHTML = '';
  for (const c of cartes) {
    const div = document.createElement('div');
    div.className = 'carte-item' + (c.slug === currentSlug ? ' active' : '');
    div.dataset.slug = c.slug;
    div.innerHTML = `
      <span class="carte-item-name">${c.theme}</span>
      <button class="btn-delete" data-slug="${c.slug}" title="Supprimer">🗑</button>
    `;
    div.addEventListener('click', (e) => {
      if (!e.target.closest('.btn-delete')) openCarte(c.slug);
    });
    div.querySelector('.btn-delete').addEventListener('click', () => deleteCarte(c.slug));
    list.appendChild(div);
  }
  document.getElementById('btn-export-all').disabled = cartes.length === 0;
}

// ── Nouvelle carte ──────────────────────────────────────────
document.getElementById('btn-new').addEventListener('click', async () => {
  const theme = prompt('Nom du thème de la nouvelle carte :');
  if (!theme) return;
  const slug = slugify(theme);
  const card = {
    theme,
    items: Array.from({ length: 10 }, (_, i) => ({ num: i + 1, question: '', reponse: '' }))
  };
  await api(`/api/cartes/${slug}`, 'POST', card);
  await loadList();
  openCarte(slug);
});

// ── Ouvrir une carte ────────────────────────────────────────
async function openCarte(slug) {
  currentSlug = slug;
  currentCard = await api(`/api/cartes/${slug}`);
  renderCard();
  await loadList();
  document.getElementById('btn-save').disabled = false;
  document.getElementById('btn-gen-all').disabled = false;
  document.getElementById('btn-export-current').disabled = false;
  document.getElementById('export-status').textContent = `Carte : ${currentCard.theme}`;
}

// ── Supprimer une carte ─────────────────────────────────────
async function deleteCarte(slug) {
  if (!confirm('Supprimer cette carte ?')) return;
  await api(`/api/cartes/${slug}`, 'DELETE');
  if (currentSlug === slug) {
    currentSlug = null;
    currentCard = null;
    renderEmpty();
  }
  await loadList();
}

// ── Render ──────────────────────────────────────────────────
function renderEmpty() {
  const content = document.getElementById('content');
  content.innerHTML = `<div id="empty-state"><div>Sélectionne ou crée une carte</div></div>`;
  document.getElementById('btn-save').disabled = true;
  document.getElementById('btn-gen-all').disabled = true;
  document.getElementById('btn-export-current').disabled = true;
  document.getElementById('export-status').textContent = 'Aucune carte chargée.';
}

function renderCard() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="col" id="col-questions">
      <div class="col-title">Questions</div>
    </div>
    <div class="col" id="col-reponses">
      <div class="col-title">Réponses</div>
    </div>
  `;
  document.getElementById('theme-input').value = currentCard.theme;
  document.getElementById('theme-input').disabled = false;

  for (const item of currentCard.items) {
    document.getElementById('col-questions').appendChild(makeItemRow(item, 'question'));
    document.getElementById('col-reponses').appendChild(makeItemRow(item, 'reponse'));
  }
}

function makeItemRow(item, field) {
  const div = document.createElement('div');
  div.className = 'item-row';
  div.innerHTML = `
    <span class="item-num">${item.num}</span>
    <textarea class="item-text" rows="2" placeholder="${field === 'question' ? 'Question…' : 'Réponse…'}">${item[field] || ''}</textarea>
    <button class="btn-ai" data-num="${item.num}" data-field="${field}">✨</button>
  `;
  const ta = div.querySelector('textarea');
  ta.addEventListener('input', () => {
    item[field] = ta.value;
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });
  setTimeout(() => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }, 0);
  div.querySelector('.btn-ai').addEventListener('click', () => generateOne(item.num, field));
  return div;
}

// ── Thème input ─────────────────────────────────────────────
document.getElementById('theme-input').addEventListener('input', (e) => {
  if (currentCard) currentCard.theme = e.target.value;
});

// ── Enregistrer ─────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', async () => {
  if (!currentSlug || !currentCard) return;
  await api(`/api/cartes/${currentSlug}`, 'POST', currentCard);
  await loadList();
  toast('Carte enregistrée ✓');
});

// ── Générer tout ─────────────────────────────────────────────
document.getElementById('btn-gen-all').addEventListener('click', async () => {
  if (!currentCard) return;
  const btn = document.getElementById('btn-gen-all');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Génération…';
  try {
    const res = await api('/api/generate', 'POST', {
      theme: currentCard.theme,
      items: currentCard.items,
    });
    if (res.error) { toast('Erreur : ' + res.error, 5000); return; }
    for (const gen of res.items) {
      const item = currentCard.items.find(i => i.num === gen.num);
      if (item) {
        if (gen.question) item.question = gen.question;
        if (gen.reponse)  item.reponse  = gen.reponse;
      }
    }
    renderCard();
    await refreshUsage();
    toast('Questions générées ✓');
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ Générer tout';
  }
});

// ── Générer une seule ────────────────────────────────────────
async function generateOne(num, field) {
  if (!currentCard) return;
  const res = await api('/api/generate', 'POST', {
    theme: currentCard.theme,
    items: currentCard.items,
    target_num: num,
  });
  if (res.error) { toast('Erreur : ' + res.error, 5000); return; }
  for (const gen of res.items) {
    if (gen.num === num) {
      const item = currentCard.items.find(i => i.num === num);
      if (item) {
        if (gen.question) item.question = gen.question;
        if (gen.reponse)  item.reponse  = gen.reponse;
      }
    }
  }
  renderCard();
  await refreshUsage();
  toast(`Question ${num} générée ✓`);
}

// ── Export ───────────────────────────────────────────────────
document.getElementById('btn-export-current').addEventListener('click', async () => {
  if (!currentSlug) return;
  await exportCards([currentSlug]);
});

document.getElementById('btn-export-all').addEventListener('click', async () => {
  await exportCards(null);
});

async function exportCards(slugs) {
  const status = document.getElementById('export-status');
  status.textContent = 'Export en cours…';
  const res = await api('/api/export', 'POST', { slugs });
  const ok  = res.results.filter(r => r.ok).length;
  const ko  = res.results.filter(r => !r.ok);
  status.textContent = `Export terminé : ${ok} PDF générés.`;
  if (ko.length) toast('Erreurs : ' + ko.map(r => r.slug + ' — ' + r.error).join(' | '), 6000);
  else toast(`${ok} PDF exportés dans /output ✓`);
}

// ── Prompt modal ─────────────────────────────────────────────
document.getElementById('btn-prompt').addEventListener('click', async () => {
  const res = await api('/api/prompt');
  document.getElementById('prompt-textarea').value = res.prompt;
  document.getElementById('modal-prompt').style.display = 'flex';
});

document.getElementById('btn-prompt-cancel').addEventListener('click', () => {
  document.getElementById('modal-prompt').style.display = 'none';
});

document.getElementById('btn-prompt-save').addEventListener('click', async () => {
  const text = document.getElementById('prompt-textarea').value;
  await api('/api/prompt', 'POST', { prompt: text });
  document.getElementById('modal-prompt').style.display = 'none';
  toast('Prompt enregistré ✓');
});

// ── Usage ────────────────────────────────────────────────────
async function refreshUsage() {
  const res = await api('/api/usage');
  document.getElementById('usage-display').textContent =
    '$' + (res.total_usd || 0).toFixed(4);
}

// ── Init ─────────────────────────────────────────────────────
(async () => {
  await loadConfig();
  await loadList();
  await refreshUsage();
})();
</script>
</body>
</html>
